      { l:"D", t:"Honestly? Someone who fits into the life you've already built without blowing it up.", d:"Integration, not disruption.", s:{booked:3,npc:1,timing:0,courting:0,ministry:0,spiritual:0} }
    ]
  },
  {
    cat: "Final check",
    text: "What would your closest church friends say about your love life?",
    opts: [
      { l:"A", t:"\"They're so intentional it's kind of scary but also admirable.\"", d:"Respect with mild concern.", s:{courting:3,npc:1,spiritual:0,timing:0,booked:0,ministry:0} },
      { l:"B", t:"\"They're fine. They're always fine. I think. We don't really know.\"", d:"The mystery remains.", s:{npc:3,booked:1,timing:1,courting:0,ministry:0,spiritual:0} },
      { l:"C", t:"\"They'll be ready when God says it's time. They actually believe that.\"", d:"Genuine faith. Not a cope.", s:{timing:3,spiritual:1,courting:0,booked:0,ministry:0,npc:0} },
      { l:"D", t:"\"They're waiting for a sign. There have been several signs. They're still waiting.\"", d:"The prophecy pipeline is long.", s:{spiritual:3,timing:1,courting:1,booked:0,ministry:0,npc:0} }
    ]
  }
];

let screen='intro', q=0, sel=null, answers=[], scores={courting:0,timing:0,ministry:0,booked:0,npc:0,spiritual:0};

function logoRow(){return`<div class="logo-row"><div class="logo-dot"></div><div><div class="logo-text">The Church Singles Quiz</div><div class="logo-sub">A self-aware personality profile</div></div></div>`}

function render(){
  const r=document.getElementById('root');
  if(screen==='intro') r.innerHTML=renderIntro();
  else if(screen==='q') r.innerHTML=renderQ();
  else r.innerHTML=renderResult();
  attach();
}

function renderIntro(){return`<div class="fade">${logoRow()}<span class="intro-pill">6 archetypes · 10 questions</span><h1 class="big">Which kind of<br><em>single Christian</em><br>are you?</h1><p class="intro-sub">A lovingly accurate personality quiz for everyone who's navigating faith, feelings, and the young adults WhatsApp group. No judgement. Mostly.</p><div class="archetype-tags"><span class="atag">I'm Not Dating, I'm Courting™</span><span class="atag">God's Timing Lah</span><span class="atag">See You at Every Ministry</span><span class="atag">Fully Booked, Fully Blessed</span><span class="atag">NPC (Main Character)</span><span class="atag">Everything Is Spiritual ✨</span></div><button class="go-btn" id="goBtn">Find out →</button></div>`}

function renderQ(){
  const qu=QUESTIONS[q];
  const pct=Math.round((q/QUESTIONS.length)*100);
  return`<div class="slide">${logoRow()}<div class="prog-wrap"><div class="prog-row"><span class="prog-label">Your profile</span><span class="prog-num">${q+1} / ${QUESTIONS.length}</span></div><div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div></div><div class="q-cat">${qu.cat}</div><h2 class="q-text">${qu.text}</h2><div class="opts">${qu.opts.map((o,i)=>`<button class="opt${sel===i?' sel':''}" data-i="${i}"><span class="opt-letter">${o.l}</span><div><div class="opt-title">${o.t}</div><div class="opt-desc">${o.d}</div></div></button>`).join('')}</div><div class="nav">${q>0?'<button class="back-btn" id="bk">← Back</button>':'<span></span>'}<button class="next-btn${sel!==null?' on':''}" id="nx">${q<QUESTIONS.length-1?'Next →':'See my result →'}</button></div></div>`}

function renderResult(){
  const max=Math.max(...Object.values(scores));
  const winner=Object.keys(scores).find(k=>scores[k]===max);
  const p=ARCHETYPES[winner];
  const total=QUESTIONS.length*3;
  const entries=[
    {k:'courting',l:'I\'m Courting™'},{k:'timing',l:'God\'s Timing Lah'},
    {k:'ministry',l:'Every Ministry'},{k:'booked',l:'Fully Booked'},
    {k:'npc',l:'NPC (Main Char)'},{k:'spiritual',l:'Everything Spiritual'}
  ].sort((a,b)=>scores[b.k]-scores[a.k]);

  return`<div class="fade">${logoRow()}<span class="res-pill">Your result</span>
  <div class="res-name">${p.name}<br><span>${p.name2}</span></div>
  <div class="res-tagline">${p.tagline}</div>
  <div class="res-divider"></div>
  <div class="res-catchphrase"><cite>Catchphrase</cite>${p.catchphrase}</div>
  <p class="res-desc">${p.desc}</p>
  <div class="traits">
    <div class="trait-card"><div class="trait-label">Energy</div><div class="trait-val">${p.energy}</div></div>
    <div class="trait-card"><div class="trait-label">Love style</div><div class="trait-val">${p.loveStyle}</div></div>
    <div class="trait-card"><div class="trait-label">Red flag (for you)</div><div class="trait-val">${p.redFlag}</div></div>
    <div class="trait-card"><div class="trait-label">Vibe</div><div class="trait-val">${p.vibe}</div></div>
  </div>
  <div class="rumour-box"><i class="ti ti-message-circle rumour-icon" aria-hidden="true"></i><div><div class="rumour-label">Church rumour</div><div class="rumour-text">${p.rumour}</div></div></div>
  <div class="bars-wrap"><div class="bar-label-row">Your archetype breakdown</div>
  ${entries.map(e=>{const pct=Math.round((scores[e.k]/total)*100);const isW=e.k===winner;return`<div class="bar-row"><span class="bar-name">${e.l}</span><div class="bar-track"><div class="bar-fill${isW?' w':''}" style="width:${Math.max(pct,2)}%"></div></div><span class="bar-pct${isW?' w':''}">${pct}%</span></div>`}).join('')}
  </div>
  <div class="also-label">You might also recognise yourself in</div>
  <div class="also-chips">${p.others.map(o=>`<span class="chip">${o}</span>`).join('')}</div>
  <div class="res-actions">
    <button class="retry-btn" id="retryBtn">Retake quiz</button>
    <button class="share-btn" id="shareBtn">Share your result ↗</button>
  </div></div>`}

function attach(){
  const go=document.getElementById('goBtn');
  if(go)go.addEventListener('click',()=>{screen='q';q=0;sel=null;scores={courting:0,timing:0,ministry:0,booked:0,npc:0,spiritual:0};answers=[];render()});

  document.querySelectorAll('.opt').forEach(b=>{b.addEventListener('click',()=>{sel=parseInt(b.dataset.i);render()})});

  const nx=document.getElementById('nx');
  if(nx)nx.addEventListener('click',()=>{
    if(sel===null)return;
    const opt=QUESTIONS[q].opts[sel];
    Object.keys(opt.s).forEach(k=>scores[k]+=opt.s[k]);
    answers[q]=sel;
    if(q<QUESTIONS.length-1){q++;sel=answers[q]!==undefined?answers[q]:null;screen='q';}
    else screen='result';
    render();
  });

  const bk=document.getElementById('bk');
  if(bk)bk.addEventListener('click',()=>{
    if(answers[q]!==undefined){const opt=QUESTIONS[q].opts[answers[q]];Object.keys(opt.s).forEach(k=>scores[k]-=opt.s[k]);}
    q--;sel=answers[q]!==undefined?answers[q]:null;screen='q';render();
  });

  const rb=document.getElementById('retryBtn');
  if(rb)rb.addEventListener('click',()=>{screen='intro';q=0;sel=null;scores={courting:0,timing:0,ministry:0,booked:0,npc:0,spiritual:0};answers=[];render()});

  const sb=document.getElementById('shareBtn');
  if(sb)sb.addEventListener('click',()=>{
    const max=Math.max(...Object.values(scores));
    const winner=Object.keys(scores).find(k=>scores[k]===max);
    const p=ARCHETYPES[winner];
    sendPrompt(`I got ${p.name} ${p.name2} on the Single Christian quiz — ${p.tagline} Tell me more about this archetype and what it says about how I approach relationships.`);
  });
}

render();
</script>
