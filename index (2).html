<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Which Switch Are You? — Schneider Electric</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --se-life-green: #3DCD58;
      --se-dark-green: #0A2F24;
      --se-light-green: #E8F9EC;
      --se-mid-green: #C4EFD0;
      --se-white: #ffffff;
      --se-text: #0A2F24;
      --se-text-muted: #4a7060;
      --se-surface: #f5faf6;
      --se-border: #d4eedd;
      --font: 'Poppins', sans-serif;
    }
    body { background: var(--se-white); font-family: var(--font); color: var(--se-text); min-height: 100vh; }
    .quiz-top-bar { background: var(--se-dark-green); height: 5px; width: 100%; }
    .quiz-inner { max-width: 680px; margin: 0 auto; padding: 36px 24px 64px; }
    .se-logo-bar { display: flex; align-items: center; margin-bottom: 48px; }
    .se-logo-svg { height: 28px; width: auto; }
    .intro-screen { animation: fadeIn 0.5s ease; }
    .intro-headline { font-family: var(--font); font-weight: 700; font-size: clamp(36px, 6vw, 56px); line-height: 1.05; color: var(--se-text); margin-bottom: 16px; }
    .intro-headline em { color: var(--se-life-green); font-style: normal; }
    .intro-sub { font-size: 17px; font-weight: 400; color: var(--se-text-muted); line-height: 1.65; margin-bottom: 36px; max-width: 500px; }
    .intro-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 44px; }
    .intro-tag { background: var(--se-white); border: 1.5px solid var(--se-border); color: var(--se-dark-green); font-size: 12px; font-weight: 500; letter-spacing: 0.04em; padding: 8px 18px; border-radius: 100px; }
    .start-btn { background: var(--se-life-green); color: var(--se-dark-green); border: none; font-family: var(--font); font-weight: 700; font-size: 15px; padding: 18px 44px; border-radius: 100px; cursor: pointer; display: inline-flex; align-items: center; gap: 12px; transition: all 0.2s; box-shadow: 0 4px 24px rgba(61,205,88,0.3); }
    .start-btn:hover { background: #48E068; transform: translateY(-2px); }
    .start-btn:active { transform: scale(0.98); }
    .progress-section { margin-bottom: 36px; }
    .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .progress-label { font-size: 11px; font-weight: 500; color: var(--se-text-muted); letter-spacing: 0.1em; text-transform: uppercase; }
    .progress-count { font-weight: 700; font-size: 13px; color: var(--se-dark-green); }
    .progress-bar-track { background: var(--se-light-green); height: 4px; border-radius: 2px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--se-life-green); border-radius: 2px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }
    .question-screen { animation: slideUp 0.4s ease; }
    .question-category { font-size: 11px; font-weight: 600; letter-spacing: 0.15em; color: var(--se-life-green); text-transform: uppercase; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    .question-category::before { content: ''; width: 24px; height: 3px; background: var(--se-life-green); display: block; border-radius: 2px; }
    .question-text { font-family: var(--font); font-weight: 700; font-size: clamp(22px, 3.5vw, 32px); line-height: 1.2; color: var(--se-text); margin-bottom: 32px; }
    .options-grid { display: flex; flex-direction: column; gap: 12px; }
    .option-btn { background: var(--se-white); border: 1.5px solid var(--se-border); border-radius: 14px; padding: 20px 22px; cursor: pointer; text-align: left; transition: all 0.2s; display: flex; align-items: flex-start; gap: 16px; color: var(--se-text); width: 100%; }
    .option-btn:hover { background: var(--se-light-green); border-color: #a8ddb8; transform: translateX(3px); }
    .option-btn.selected { background: var(--se-light-green); border-color: var(--se-life-green); border-width: 2px; }
    .option-letter { width: 30px; height: 30px; min-width: 30px; border-radius: 50%; background: var(--se-surface); border: 1.5px solid var(--se-border); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; color: var(--se-text-muted); transition: all 0.2s; flex-shrink: 0; margin-top: 2px; }
    .option-btn.selected .option-letter { background: var(--se-life-green); border-color: var(--se-life-green); color: var(--se-dark-green); }
    .option-headline { font-weight: 600; font-size: 15px; color: var(--se-text); margin-bottom: 5px; line-height: 1.3; }
    .option-desc { font-size: 13px; font-weight: 400; color: var(--se-text-muted); line-height: 1.55; }
    .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; }
    .back-btn { background: transparent; border: 1.5px solid var(--se-border); color: var(--se-text-muted); padding: 13px 22px; border-radius: 100px; cursor: pointer; font-family: var(--font); font-weight: 500; font-size: 13px; transition: all 0.2s; }
    .back-btn:hover { border-color: var(--se-dark-green); color: var(--se-dark-green); }
    .next-btn { background: var(--se-life-green); color: var(--se-dark-green); border: none; font-family: var(--font); font-weight: 700; font-size: 14px; padding: 15px 36px; border-radius: 100px; cursor: pointer; transition: all 0.2s; opacity: 0.3; pointer-events: none; box-shadow: 0 3px 16px rgba(61,205,88,0.25); }
    .next-btn.active { opacity: 1; pointer-events: all; }
    .next-btn.active:hover { background: #48E068; transform: translateY(-1px); }
    .next-btn.active:active { transform: scale(0.98); }
    .result-screen { animation: fadeIn 0.6s ease; }
    .result-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--se-light-green); border: 1px solid var(--se-mid-green); color: var(--se-dark-green); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; padding: 7px 16px; border-radius: 100px; margin-bottom: 20px; }
    .result-badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--se-life-green); }
    .result-product-name { font-family: var(--font); font-weight: 700; font-size: clamp(40px, 7vw, 62px); color: #000000; line-height: 0.95; margin-bottom: 6px; }
    .result-product-name span { color: var(--se-life-green); }
    .result-tagline { font-weight: 600; font-size: clamp(16px, 2.2vw, 22px); color: #000000; margin-bottom: 28px; }
    .result-divider { width: 52px; height: 4px; background: var(--se-life-green); margin-bottom: 28px; border-radius: 2px; }
    .result-desc { font-size: 15px; font-weight: 400; color: var(--se-text-muted); line-height: 1.75; margin-bottom: 36px; max-width: 560px; }
    .result-attributes { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 36px; }
    .attr-card { background: var(--se-surface); border: 1.5px solid var(--se-border); border-radius: 14px; padding: 16px 14px; }
    .attr-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; color: var(--se-text-muted); text-transform: uppercase; margin-bottom: 6px; }
    .attr-value { font-weight: 600; font-size: 13px; color: #000000; line-height: 1.3; }
    .score-bar-wrap { margin-bottom: 32px; }
    .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--se-text-muted); margin-bottom: 14px; }
    .score-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
    .score-name { font-size: 12px; font-weight: 500; color: var(--se-text-muted); width: 90px; flex-shrink: 0; }
    .score-track { flex: 1; height: 5px; background: var(--se-light-green); border-radius: 3px; overflow: hidden; }
    .score-fill { height: 100%; border-radius: 3px; background: var(--se-mid-green); transition: width 1s cubic-bezier(.4,0,.2,1); }
    .score-fill.winner { background: var(--se-life-green); }
    .score-pct { font-weight: 700; font-size: 11px; color: var(--se-text-muted); width: 30px; text-align: right; flex-shrink: 0; }
    .score-pct.winner { color: #000000; }
    .others-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 36px; }
    .other-chip { background: var(--se-white); border: 1.5px solid var(--se-border); color: var(--se-text-muted); padding: 8px 18px; border-radius: 100px; font-size: 12px; font-weight: 500; }
    .result-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .retry-btn { background: transparent; border: 1.5px solid var(--se-border); color: var(--se-text-muted); padding: 15px 30px; border-radius: 100px; cursor: pointer; font-family: var(--font); font-weight: 500; font-size: 13px; transition: all 0.2s; }
    .retry-btn:hover { border-color: var(--se-dark-green); color: var(--se-dark-green); }
    .explore-btn { background: var(--se-life-green); color: var(--se-dark-green); border: none; font-family: var(--font); font-weight: 700; font-size: 14px; padding: 15px 32px; border-radius: 100px; cursor: pointer; transition: all 0.2s; box-shadow: 0 3px 16px rgba(61,205,88,0.3); }
    .explore-btn:hover { background: #48E068; transform: translateY(-1px); }

    /* ── RESULT HERO LAYOUT ── */
    .result-hero {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 4px;
    }
    .result-hero-text {
      flex: 1;
      min-width: 0;
    }

    /* ── CAROUSEL ── */
    .carousel-wrap {
      position: relative;
      width: 180px;
      min-width: 180px;
      height: 180px;
      flex-shrink: 0;
      background: transparent;
      border-radius: 12px;
      overflow: visible;
    }
    .carousel-track {
      width: 180px;
      height: 180px;
      position: relative;
    }
    .carousel-img {
      position: absolute;
      top: 0; left: 0;
      width: 180px;
      height: 180px;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.4s ease;
      background: transparent;
      pointer-events: none;
    }
    .carousel-img.active {
      opacity: 1;
      pointer-events: all;
    }
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.85);
      border: 1.5px solid var(--se-border);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--se-dark-green);
      padding: 0;
      transition: all 0.15s;
      z-index: 2;
    }
    .carousel-btn:hover {
      background: var(--se-life-green);
      border-color: var(--se-life-green);
      color: white;
    }
    .carousel-prev { left: -14px; }
    .carousel-next { right: -14px; }
    .carousel-dots {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
    }
    .carousel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--se-border);
      cursor: pointer;
      transition: background 0.2s;
    }
    .carousel-dot.active {
      background: var(--se-life-green);
    }

    @media (max-width: 480px) {
      .result-hero { flex-direction: column-reverse; }
      .carousel-wrap { width: 140px; min-width: 140px; height: 140px; align-self: center; }
      .carousel-track { width: 140px; height: 140px; }
      .carousel-img { width: 140px; height: 140px; }
    }
  
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>

    function render() {
      const el = document.getElementById('quizContent');
      if (screen === 'intro') el.innerHTML = renderIntro();
      else if (screen === 'question') el.innerHTML = renderQuestion();
      else if (screen === 'result') el.innerHTML = renderResult();
      attachEvents();
    }

    function logoBar() {
      return `<div class="se-logo-bar">${SE_LOGO}</div>`;
    }

    function renderIntro() {
      return `<div class="intro-screen">
        ${logoBar()}
        <h1 class="intro-headline">Which <em>switch</em><br>are you?</h1>
        <p class="intro-sub">8 questions designed for architects and interior designers. Discover which switch range aligns with your design philosophy and project vision.</p>
        <div class="intro-tags">
          <span class="intro-tag">Unica X</span>
          <span class="intro-tag">AvatarOn</span>
          <span class="intro-tag">AvatarOn C</span>
          <span class="intro-tag">Vivace E</span>
        </div>
        <button class="start-btn" id="startBtn">Begin the quiz &nbsp;→</button>
      </div>`;
    }

    function renderQuestion() {
      const q = questions[currentQ];
      const pct = (currentQ / questions.length) * 100;
      return `<div class="question-screen">
        ${logoBar()}
        <div class="progress-section">
          <div class="progress-row">
            <span class="progress-label">Style profile</span>
            <span class="progress-count">${currentQ + 1} / ${questions.length}</span>
          </div>
          <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="question-category">${q.category}</div>
        <h2 class="question-text">${q.text}</h2>
        <div class="options-grid">
          ${q.options.map((o, i) => `
            <button class="option-btn ${selectedOption === i ? 'selected' : ''}" data-idx="${i}">
              <span class="option-letter">${o.letter}</span>
              <div>
                <div class="option-headline">${o.headline}</div>
                <div class="option-desc">${o.desc}</div>
              </div>
            </button>`).join('')}
        </div>
        <div class="nav-row">
          ${currentQ > 0 ? '<button class="back-btn" id="backBtn">← Back</button>' : '<span></span>'}
          <button class="next-btn ${selectedOption !== null ? 'active' : ''}" id="nextBtn">
            ${currentQ < questions.length - 1 ? 'Next question →' : 'See my result →'}
          </button>
        </div>
      </div>`;
    }

    function renderResult() {
      const maxScore = Math.max(...Object.values(scores));
      const winner = Object.keys(scores).find(k => scores[k] === maxScore);
      const p = products[winner];
      const totalPossible = questions.length * 3;

      const scoreEntries = [
        { key: 'unicaX', label: 'Unica X' },
        { key: 'avatarOn', label: 'AvatarOn' },
        { key: 'avatarOnC', label: 'AvatarOn C' },
        { key: 'vivaceE', label: 'Vivace E' }
      ].sort((a, b) => scores[b.key] - scores[a.key]);

      const nameParts = p.name.split(' ');
      const nameHtml = nameParts.length > 1
        ? nameParts.slice(0,-1).join(' ') + ' <span>' + nameParts.slice(-1) + '</span>'
        : '<span>' + p.name + '</span>';

      return `<div class="result-screen">
        ${logoBar()}
        <span class="result-badge">Your result</span>
        <div class="result-hero">
          <div class="result-hero-text">
            <h2 class="result-product-name">${nameHtml}</h2>
            <p class="result-tagline">${p.tagline}</p>
            <div class="result-divider"></div>
          </div>
          <div class="carousel-wrap" id="carousel-${winner}">

              ${(PRODUCT_IMAGES[winner]||[]).map((src,i)=>`<img src="${src}" class="carousel-img ${i===0?'active':''}" data-idx="${i}" alt="Product view ${i+1}"/>`).join('')}
            </div>
            <button class="carousel-btn carousel-prev" onclick="carouselNav('${winner}',-1)">&#8249;</button>
            <button class="carousel-btn carousel-next" onclick="carouselNav('${winner}',1)">&#8250;</button>
            <div class="carousel-dots">
              ${(PRODUCT_IMAGES[winner]||[]).map((_,i)=>`<span class="carousel-dot ${i===0?'active':''}" onclick="carouselGoTo('${winner}',${i})"></span>`).join('')}
            </div>
          </div>
        </div>
        <p class="result-desc">${p.desc}</p>
        <div class="result-attributes">
          <div class="attr-card"><div class="attr-label">Best for</div><div class="attr-value">${p.style}</div></div>
          <div class="attr-card"><div class="attr-label">Edge style</div><div class="attr-value">${p.edge}</div></div>
          <div class="attr-card"><div class="attr-label">Finish</div><div class="attr-value">${p.finish}</div></div>
          <div class="attr-card"><div class="attr-label">Key function</div><div class="attr-value">${p.feature}</div></div>
        </div>
        <div class="score-bar-wrap">
          <div class="section-label">Your style profile breakdown</div>
          ${scoreEntries.map(e => {
            const pct = Math.round((scores[e.key] / totalPossible) * 100);
            const isW = e.key === winner;
            return `<div class="score-row">
              <span class="score-name">${e.label}</span>
              <div class="score-track"><div class="score-fill ${isW ? 'winner' : ''}" style="width:${Math.max(pct,2)}%"></div></div>
              <span class="score-pct ${isW ? 'winner' : ''}">${pct}%</span>
            </div>`;
          }).join('')}
        </div>
        <div class="section-label">Also explore</div>
        <div class="others-chips">${p.others.map(o => `<span class="other-chip">${o}</span>`).join('')}</div>
        <div class="result-actions">
          <button class="retry-btn" id="retryBtn">Retake quiz</button>
          <button class="explore-btn" id="exploreBtn">Explore ${p.name} at se.com →</button>
        </div>
      </div>`;
    }

    function attachEvents() {
      const startBtn = document.getElementById('startBtn');
      if (startBtn) startBtn.addEventListener('click', () => {
        screen = 'question'; currentQ = 0; selectedOption = null;
        scores = { unicaX: 0, avatarOn: 0, avatarOnC: 0, vivaceE: 0 };
        answers = []; render();
      });

      document.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => { selectedOption = parseInt(btn.dataset.idx); render(); });
      });

      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) nextBtn.addEventListener('click', () => {
        if (selectedOption === null) return;
        const opt = questions[currentQ].options[selectedOption];
        Object.keys(opt.scores).forEach(k => scores[k] += opt.scores[k]);
        answers[currentQ] = selectedOption;
        if (currentQ < questions.length - 1) {
          currentQ++;
          selectedOption = answers[currentQ] !== undefined ? answers[currentQ] : null;
          screen = 'question';
        } else { screen = 'result'; }
        render();
      });

      const backBtn = document.getElementById('backBtn');
      if (backBtn) backBtn.addEventListener('click', () => {
        if (answers[currentQ] !== undefined) {
          const opt = questions[currentQ].options[answers[currentQ]];
          Object.keys(opt.scores).forEach(k => scores[k] -= opt.scores[k]);
        }
        currentQ--;
        selectedOption = answers[currentQ] !== undefined ? answers[currentQ] : null;
        screen = 'question'; render();
      });

      const retryBtn = document.getElementById('retryBtn');
      if (retryBtn) retryBtn.addEventListener('click', () => {
        screen = 'intro'; currentQ = 0; selectedOption = null;
        scores = { unicaX: 0, avatarOn: 0, avatarOnC: 0, vivaceE: 0 };
        answers = []; render();
      });

      const exploreBtn = document.getElementById('exploreBtn');
      if (exploreBtn) exploreBtn.addEventListener('click', () => {
        window.open('https://www.se.com/sg/switch-socket', '_blank');
      });
    }

    // ── CAROUSEL ──
    const carouselState = {};
    function carouselInit(winner) {
      carouselState[winner] = 0;
    }
    function carouselNav(winner, dir) {
      const imgs = PRODUCT_IMAGES[winner] || [];
      if (!imgs.length) return;
      let idx = (carouselState[winner] || 0) + dir;
      if (idx < 0) idx = imgs.length - 1;
      if (idx >= imgs.length) idx = 0;
      carouselGoTo(winner, idx);
    }
    function carouselGoTo(winner, idx) {
      carouselState[winner] = idx;
      document.querySelectorAll('.carousel-img').forEach((el,i) => {
        el.classList.toggle('active', i === idx);
      });
      document.querySelectorAll('.carousel-dot').forEach((el,i) => {
        el.classList.toggle('active', i === idx);
      });
    }

    render();
  </script>
